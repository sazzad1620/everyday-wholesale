<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!--
    Same viewport Flutter's engine sets when it starts (full_page_embedding_
    strategy.dart). Without it here, phones lay out the loading screen on a
    ~980px-wide virtual page, so the logo shows tiny and then jumps to full
    size once Flutter adds its own tag. `flt-viewport` marks it as the
    engine's, so Flutter swaps it without a warning.
  -->
  <meta flt-viewport name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Halal groceries and wholesale food from Everyday Wholesale, Hanyu, Saitama.">
  <meta name="theme-color" content="#2E7D32">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Everyday Wholesale">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Everyday Wholesale</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Stripe.js is intentionally NOT loaded here: it used to block the whole
    page from starting. flutter_stripe_web injects it by itself, and the app
    warms it up in the background after launch (see StripeSetup).
  -->

  <!-- Open connections to the hosts the app always needs, in parallel with
       downloading the app itself (engine, Firebase SDK, database, images). -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin>
  <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com">
  <link rel="dns-prefetch" href="https://securetoken.googleapis.com">
  <!--
    The Firebase JS SDK is otherwise only requested once the app has
    downloaded and started — fetch it in parallel instead. The version must
    match `supportedFirebaseJsSdkVersion` in the firebase_core_web package
    (currently 12.19.0). tool/web/finalize_build.js rewrites these to the
    installed version on every deploy, so they cannot go stale.
    (No preload for main.dart.js/.wasm: which one is needed depends on the
    browser, and the versioned URLs are only known to the bootstrap script.)
  -->
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-pipelines.js" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.19.0/firebase-storage.js" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.19.0/firebase-functions.js" crossorigin>

  <style>
    html, body { margin: 0; height: 100%; background: #FFFFFF; }
    /* Shown instantly by the browser, before Flutter has downloaded — laid
       out exactly like the app's own splash page (logo 180px wide, centred
       on white) so the hand-over is seamless. Removed on Flutter's first
       frame. */
    #app-loader {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      background: #FFFFFF;
      transition: opacity 250ms ease-out;
    }
    #app-loader.done { opacity: 0; pointer-events: none; }
    #app-loader img { width: 180px; height: auto; }
    #app-loader .spinner {
      position: absolute; top: calc(50% + 110px); left: 50%;
      width: 26px; height: 26px; margin-left: -13px;
      border: 3px solid rgba(46, 125, 50, 0.18);
      border-top-color: #2E7D32; border-radius: 50%;
      animation: app-loader-spin 800ms linear infinite;
    }
    @keyframes app-loader-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #app-loader .spinner { animation-duration: 2400ms; }
    }
  </style>
</head>
<body>
  <script>
    // The app used to live at /#/home/…; it now uses real paths. Turn any
    // old bookmarked/shared `#/` link into its path form before Flutter
    // reads the URL, so it still opens the right page.
    if (location.hash.indexOf('#/') === 0) {
      history.replaceState(null, '', location.hash.slice(1) + location.search);
    }
  </script>
  <div id="app-loader" role="progressbar" aria-label="Loading Everyday Wholesale">
    <img src="icons/loader-logo.webp" alt="Everyday Wholesale" width="180" height="168">
    <div class="spinner"></div>
  </div>
  <script>
    // Flutter's first frame replaces both the plain loader and, on pages
    // served by the `ssr` Cloud Function, the server-rendered HTML content.
    window.addEventListener('flutter-first-frame', function () {
      var ssr = document.getElementById('ssr-content');
      if (ssr) ssr.remove();
      var loader = document.getElementById('app-loader');
      if (!loader) return;
      loader.classList.add('done');
      setTimeout(function () { loader.remove(); }, 300);
    });
  </script>
  <!--
    web/flutter_bootstrap.js, inlined at build time — saves a round trip
    before the app download can even start. See that file for the
    versioned-URL caching it sets up.
    https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    {{flutter_bootstrap_js}}
  </script>
</body>
</html>
