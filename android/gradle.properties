org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# stripe_android (pulled in by flutter_stripe) doesn't pin its own Kotlin
# jvmTarget, so it inherits whatever JDK Gradle runs on (21) while its Java
# sources stay pinned to 17 — Kotlin's newer strict validation treats that
# mismatch as a hard build failure even though app/library code we own is
# consistently on 17. Demoting to a warning is the property Kotlin itself
# documents for exactly this case (KT-53645); it doesn't change our own
# module's JVM target (still pinned to 17 in app/build.gradle.kts).
kotlin.jvm.target.validation.mode=warning
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
